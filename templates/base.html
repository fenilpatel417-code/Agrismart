<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}AgriSmart — AI Crop Disease Detection{% endblock %}</title>
  <meta name="description" content="{% block desc %}Detect crop diseases instantly using AI. Get treatment plans, growth tips, and expert agricultural advice powered by Google Gemini.{% endblock %}" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>" />
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<nav class="navbar">
  <a href="/" class="nav-logo"><span>🌱</span> AgriSmart</a>
  <div class="nav-links">
    <a href="/" id="nav-home">Home</a>
    <a href="/detect" id="nav-detect">Detect Disease</a>
    <a href="/chatbot" id="nav-chat">AI Chatbot</a>
    <a href="/history" id="nav-history">History</a>
    <a href="/detect" class="nav-cta">Analyze Crop →</a>
  </div>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

<footer>
  <p>🌱 AgriSmart &mdash; Built with ❤️ using Python & Google Gemini AI &nbsp;|&nbsp; <a href="/detect">Start Analyzing</a></p>
</footer>

<script>
  // Highlight active nav link
  const path = window.location.pathname;
  if(path === '/') document.getElementById('nav-home').classList.add('active');
  if(path === '/detect') document.getElementById('nav-detect').classList.add('active');
  if(path === '/chatbot') document.getElementById('nav-chat').classList.add('active');
  if(path === '/history') document.getElementById('nav-history').classList.add('active');
</script>
{% block scripts %}{% endblock %}
</body>
</html>
